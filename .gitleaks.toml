title = "SmartFlowSocial allowlist"

[extend]
useDefault = true

[allowlist]
description = "Public AWS documentation example, the Cypress fixture key, and the fake NWC secret in the encryption unit test"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''abc123def456''',
]
paths = [
  '''tests/e2e/support/nostr-test-keys\.ts''',
  '''tests/utils/nostr-mock\.ts''',
  '''cypress/support/nostr-test-keys\.ts''',
]
