title = "SmartFlowSocial allowlist"

[extend]
useDefault = true

[allowlist]
description = "Public AWS documentation example, fixture keys, and the env-name list in the env unit test"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''abc123def456''',
]
paths = [
  '''tests/e2e/support/nostr-test-keys\.ts''',
  '''tests/utils/nostr-mock\.ts''',
  '''cypress/support/nostr-test-keys\.ts''',
  '''tests/unit/lib/env\.server\.branches\.test\.ts''',
]
