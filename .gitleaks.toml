title = "SmartFlowSocial allowlist"

[extend]
useDefault = true

[allowlist]
description = "Public AWS documentation example, fixture keys, the env-name list in the env unit test, and a removed compose placeholder that remains in be6d8de"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''abc123def456''',
  '''compose-acceptance-cron-secret-32-chars''',
]
paths = [
  '''tests/e2e/support/nostr-test-keys\.ts''',
  '''tests/utils/nostr-mock\.ts''',
  '''cypress/support/nostr-test-keys\.ts''',
  '''tests/unit/lib/env\.server\.branches\.test\.ts''',
]
