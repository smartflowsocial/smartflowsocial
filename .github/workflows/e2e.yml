name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Smoke and the full core suite both run. A failure fails the workflow.
  # Hydration errors fail the run. ALLOW_HYDRATION_EXCEPTIONS stays false.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  E2E_TEST: "true"
  PORT: "3000"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
  SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum
  REDIS_URL: redis://127.0.0.1:6379
  SFS_DEPLOYMENT_MODE: hosted
  ALLOW_HYDRATION_EXCEPTIONS: "false"

jobs:
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Prepare database
        run: pnpm exec prisma db push

      - name: Run smoke E2E suite
        run: pnpm test:e2e:smoke:run

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-smoke-artifacts
          path: |
            tests/e2e/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7

  e2e-core-pr:
    name: E2E Core (PR subset)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Prepare database
        run: pnpm exec prisma db push

      - name: Run core subset
        run: pnpm exec start-server-and-test "cross-env E2E_TEST=true PORT=3000 pnpm dev" http://localhost:3000 "E2E_TEST=true pnpm exec cypress run --spec tests/e2e/core/drafts.cy.ts,tests/e2e/core/scheduling.cy.ts,tests/e2e/core/settings.cy.ts"

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-core-pr-artifacts
          path: |
            tests/e2e/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7

  e2e-core:
    name: E2E Core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Prepare database
        run: pnpm exec prisma db push

      - name: Run core E2E suite
        run: pnpm exec start-server-and-test "cross-env E2E_TEST=true PORT=3000 pnpm dev" http://localhost:3000 "E2E_TEST=true pnpm exec cypress run --spec \"tests/e2e/core/**/*.cy.ts\""

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-core-artifacts
          path: |
            tests/e2e/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
