name: CI

# Single pipeline for pushes and pull requests. It replaces the former
# smoke-test, test-matrix, test-caching, coverage, pr-checks and deploy
# workflows, which all re-ran the same test suites on separate runners.
#
# Jobs:
#   lint   - eslint, prettier, tsc (app + e2e config), semantic PR title
#   test   - full vitest run with coverage (unit, integration, property,
#            security, performance) + DB index governance, all on one
#            runner that already has Postgres and the schema pushed
#   build  - production build + bundle budget
#   image  - production image build, boot, and /healthcheck

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky coverage comment / semantic title check

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
  SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

jobs:
  lint:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Generate React Router types
        run: pnpm exec react-router typegen

      - name: Check PR title (conventional commits)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
            build
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            must not start with an uppercase character.

      - name: Check the published release manifest
        run: node scripts/release-manifest.mjs

      - name: ESLint
        run: pnpm lint:ci

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: |
          set +e
          pnpm exec tsc --noEmit --skipLibCheck > /tmp/tsc-output.log 2>&1
          # Every project error fails the build. Dependency .d.ts errors stay out.
          ERRORS=$(grep -E "error TS" /tmp/tsc-output.log | grep -v node_modules || true)
          if [ -n "$ERRORS" ]; then
            echo "TypeScript errors found:"
            echo "$ERRORS"
            exit 1
          fi
          if [ -f tests/e2e/tsconfig.json ]; then
            pnpm exec tsc -p tests/e2e/tsconfig.json --noEmit --skipLibCheck > /tmp/tsc-e2e-output.log 2>&1
            E2E_ERRORS=$(grep -E "error TS" /tmp/tsc-e2e-output.log | grep -v node_modules || true)
            if [ -n "$E2E_ERRORS" ]; then
              echo "TypeScript errors found in e2e tests:"
              echo "$E2E_ERRORS"
              exit 1
            fi
          fi
          echo "TypeScript type check passed"

      - name: Lint workflows
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: false
          pyflakes: false

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17 # matches production
          database: smartflow_test
          user: postgres

      # Schema push is the fast path for this suite. It does not prove migration
      # order. The migrate job is the clean-install release gate.
      - name: Push Prisma schema
        run: pnpm exec prisma db push

      - name: Verify critical indexes
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/VERIFY_INDEXES.sql

      # Loopback relay, ephemeral key, and the disposable CI database. This does
      # not replace the unit suites and does not call a public relay.
      - name: Local relay publishing integration
        run: pnpm test:relay-publish
        env:
          REDIS_URL: redis://127.0.0.1:6379

      # One vitest run covers unit, integration, property, security and
      # performance suites. Coverage thresholds are enforced by
      # vitest.config.ts (lines/statements/functions 70%, branches 60%).
      - name: Run all test suites with coverage
        run: pnpm test:coverage

      - name: Enforce performance budget
        run: node scripts/check-performance-budgets.mjs --source=vitest

      - name: Summarise coverage
        id: coverage
        if: always()
        run: |
          node <<'NODE'
          const fs = require("fs");
          const file = "coverage/coverage-summary.json";
          if (!fs.existsSync(file)) process.exit(0);
          const total = JSON.parse(fs.readFileSync(file, "utf8")).total;
          const out = [];
          const summary = ["## Coverage", "", "| Metric | Coverage |", "|---|---|"];
          for (const m of ["lines", "statements", "functions", "branches"]) {
            const pct = Number(total[m]?.pct ?? 0).toFixed(2);
            out.push(`${m}=${pct}`);
            summary.push(`| ${m} | ${pct}% |`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
          NODE

      # Tokenless Codecov uploads are rejected for this organization. Coverage
      # thresholds in vitest.config.ts stay enforced, and the artifact below is
      # the record when CODECOV_TOKEN is unset. Fork PRs have no token and are
      # not uploaded. A configured token that Codecov rejects fails this step.
      - name: Note Codecov configuration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: codecov-auth
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Codecov not configured::CODECOV_TOKEN is unset. No coverage was sent to Codecov. Thresholds in this job remain enforced and the coverage artifact is uploaded."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is set. The upload fails the job if Codecov rejects it."
          fi

      - name: Upload coverage to Codecov
        if: steps.codecov-auth.outputs.configured == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage/coverage-summary.json
          flags: unittests
          fail_ci_if_error: true

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/junit.xml
            test-results/results.json
            coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.coverage.outputs.lines != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          message: |
            ## Test Coverage

            | Metric | Coverage | Threshold |
            |---|---|---|
            | Lines | ${{ steps.coverage.outputs.lines }}% | 70% |
            | Statements | ${{ steps.coverage.outputs.statements }}% | 70% |
            | Functions | ${{ steps.coverage.outputs.functions }}% | 70% |
            | Branches | ${{ steps.coverage.outputs.branches }}% | 60% |

            [Run details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  migrate:
    name: Clean install migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_migrate
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup empty PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17
          database: smartflow_migrate
          user: postgres

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify schema, plans, and payout index
        run: pnpm exec tsx scripts/verify-migrated-database.ts

  build:
    name: Build & Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Enforce frontend bundle budgets
        run: node scripts/check-performance-budgets.mjs --source=bundle

  image:
    name: Docker image boots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartflow_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartflow_image"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --build-arg SOURCE_COMMIT="${{ github.sha }}" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --tag smartflowsocial:ci .

      - name: Boot the image against Postgres and Redis
        run: |
          set -euo pipefail
          docker run --detach --name smartflow-ci \
            --add-host=host.docker.internal:host-gateway \
            --publish 3000:3000 \
            --env DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/smartflow_image \
            --env REDIS_URL=redis://host.docker.internal:6379 \
            --env SESSION_SECRET=test-session-secret-very-long-and-secure-32-chars-minimum \
            --env CRON_SECRET=test-cron-secret-very-long-and-secure-32-chars \
            --env NOSTR_PUBLISHER_URL=http://127.0.0.1:9/publish \
            --env NOSTR_PUBLISHER_API_TOKEN=test-publisher-token \
            smartflowsocial:ci
          for _ in $(seq 1 60); do
            if curl --silent --show-error --fail --max-time 5 --dump-header /tmp/health-headers http://127.0.0.1:3000/healthcheck; then
              echo
              reported="$(awk 'tolower($1)=="x-source-commit:" { print $2 }' /tmp/health-headers | tr -d '\r')"
              if [ "$reported" != "${{ github.sha }}" ]; then
                echo "image reported source commit '$reported'"
                exit 1
              fi
              echo "healthcheck ok source=$reported"
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' smartflow-ci | grep -qx true; then
              echo "container exited before healthcheck passed"
              docker logs smartflow-ci
              exit 1
            fi
            sleep 2
          done
          echo "healthcheck did not succeed"
          docker logs smartflow-ci
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs smartflow-ci || true
