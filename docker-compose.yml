# Development only. Do not run this file on a public server.
#
# Postgres and Redis are bound to 127.0.0.1. Other containers on this Compose
# network can still reach them by service name. The host ports are for
# `pnpm dev` on the same machine.
#
# Credentials below are development defaults, not production secrets.
# Postgres 16 matches CI. Do not switch this image back to `latest`.
#
# `pnpm dev` runs the web server and the worker.
# Publishing is in-process. SELF_HOSTED=true selects that publisher.
# `pnpm publisher:local` remains a signature-checking HTTP stub. It does not open relays.
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
